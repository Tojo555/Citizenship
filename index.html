<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>My Citizenship Grade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Single column: code entry card, then one report with a large grade figure, breakdown, counts, feedback, recent days. */
:root{
  --bg:#eef2f4; --surface:#ffffff; --ink:#15232c; --muted:#5b6b75; --line:#d5dde2;
  --accent:#1f5f8b; --accent-ink:#ffffff; --accent-soft:#dbe8f1;
  --culprit:#a8402f; --culprit-soft:#f6e1dc; --good:#2f7d4f; --gold-soft:#f6e9d2;
  --display:"Bricolage Grotesque","Inter",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f171c; --surface:#18232a; --ink:#e5edf1; --muted:#93a4ae; --line:#2a3943;
  --accent:#6fb0dc; --accent-ink:#0b1a24; --accent-soft:#1d3546;
  --culprit:#ec8a78; --culprit-soft:#3b211c; --good:#62c08a; --gold-soft:#3a2d17; color-scheme:dark;}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font-family:var(--display);font-weight:800;font-size:1.6rem;margin:0;letter-spacing:-.015em;line-height:1.1}
.credit{font-size:.7rem;color:var(--muted);text-align:right;line-height:1.3;max-width:13em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.small{font-size:.82rem;color:var(--muted)}
label{font-weight:600;font-size:.9rem}
.codein{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;font-family:ui-monospace,Menlo,monospace;font-size:1.3rem;letter-spacing:.12em;text-transform:uppercase}
.btn{border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;padding:12px 16px;border-radius:12px;cursor:pointer}
.btn:disabled{opacity:.6;cursor:default}
.btn.ghost{background:var(--accent-soft);color:var(--ink)}
.err{background:var(--culprit-soft);border-radius:10px;padding:10px 12px;font-size:.9rem}
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.big{font-family:var(--display);font-weight:800;font-size:4.6rem;line-height:.9;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.who{display:flex;flex-direction:column;gap:2px;min-width:0}
.who b{font-size:1.15rem;overflow-wrap:anywhere}
.math{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-variant-numeric:tabular-nums;font-size:.95rem}
.math .tot{border-top:1px solid var(--line);padding-top:6px;font-weight:700}
.minus{color:var(--culprit)}
.bar{position:relative;height:12px;border-radius:6px;background:var(--bg);overflow:hidden}
.bar span{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:6px}
.bar i{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
h2{font-family:var(--display);font-size:1.1rem;margin:0}
.counts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.counts li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
.counts li:last-child{border-bottom:0}
.counts b{font-variant-numeric:tabular-nums}
.x b{color:var(--culprit)}
.fb{border-left:3px solid var(--accent);padding:4px 0 4px 12px}
.fb p{margin:2px 0 0}
.day{display:grid;grid-template-columns:7.5em 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.day:last-child{border-bottom:0}
.tag{display:inline-block;font-size:.78rem;border-radius:6px;padding:1px 7px;margin:2px 4px 2px 0;background:var(--accent-soft)}
.tag.x{background:var(--culprit-soft)}
.none{color:var(--muted)}
.dt{color:var(--ink);font-weight:600}
.unofficial{background:var(--gold-soft);border-radius:10px;padding:10px 12px;font-size:.88rem;line-height:1.45}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.ptsline{font-family:var(--display);font-weight:600;font-size:1.05rem;color:var(--accent);font-variant-numeric:tabular-nums}
.pill{font-size:.7rem;font-weight:600;background:var(--accent-soft);border-radius:999px;padding:1px 8px;margin-left:4px;vertical-align:1px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>My Citizenship<br>Grade</h1>
    <div class="credit">Prepared with AI support, reviewed by Mr. Johnson</div>
  </div>

  <form class="card" id="form" autocomplete="off">
    <label for="code">Your private code</label>
    <input class="codein" id="code" inputmode="text" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX" maxlength="12">
    <label class="small" style="font-weight:400;display:flex;gap:8px;align-items:center"><input type="checkbox" id="remember"> Remember my code on this device</label>
    <button class="btn" id="go" type="submit">See my grade</button>
    <div class="err" id="err" hidden></div>
    <p class="small" style="margin:0">Don't share your code. Anyone with it can see your grade and feedback.</p>
  </form>

  <div id="report"></div>
</div>
<script>
(() => {
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const te = new TextEncoder(), td = new TextDecoder();
const unb64 = str => { const s = atob(str); const b = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i); return b; };
const fmtDate = iso => iso ? new Date(iso + "T12:00:00").toLocaleDateString(undefined, {weekday:"short", month:"short", day:"numeric"}) : "";
const normCode = c => String(c).toUpperCase().replace(/[^A-Z0-9]/g, "");

async function open(code){
  const r = await fetch("data/reports.json?t=" + Date.now(), {cache: "no-store"});
  if (!r.ok) throw new Error("none");
  const file = await r.json();
  const k = await crypto.subtle.importKey("raw", te.encode(normCode(code)), "PBKDF2", false, ["deriveBits"]);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2", salt: unb64(file.salt), iterations: file.iter, hash:"SHA-256"}, k, 512));
  const id = Array.from(bits.slice(32, 44), b => b.toString(16).padStart(2, "0")).join("");
  const entry = file.r[id]; if (!entry) throw new Error("code");
  const key = await crypto.subtle.importKey("raw", bits.slice(0, 32), "AES-GCM", false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv: unb64(entry.iv)}, key, unb64(entry.ct));
  return JSON.parse(td.decode(pt));
}

function render(R){
  const g = R.g;
  const pct = R.avg == null ? 0 : Math.max(0, Math.min(R.avg / R.max, 1)) * 100;
  const goal = R.target / R.max * 100;
  const period = R.unit ? R.unit.name : R.termStart || R.termEnd ? `${R.termStart ? fmtDate(R.termStart) : "start"} to ${R.termEnd ? fmtDate(R.termEnd) : "now"}` : "all class days so far";
  const fmtPts = v => v == null ? "–" : (Number.isInteger(v) ? v + ".0" : String(v));
  const counts = (list, cls) => list.length ? `<ul class="counts ${cls}">${list.map(x => `<li><span>${esc(x.l)}</span><b>${x.n}</b></li>`).join("")}</ul>` : `<p class="none" style="margin:0">None yet.</p>`;
  $("#report").innerHTML = `
  <section class="card">
    <div class="hero">
      <div class="big" aria-label="Suggested grade">${g ? g.grade : "–"}</div>
      <div class="who"><span class="eyebrow">Suggested citizenship grade</span><b>${esc(R.name)}</b>${R.unit && g ? `<span class="ptsline">${fmtPts(R.unit.points)} / ${R.unit.pts} pts${R.unit.current ? " so far" : ""}</span>` : ""}<span class="small">${esc(R.cls)} · ${esc(period)}</span><span class="small">Updated ${new Date(R.updated).toLocaleString(undefined, {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"})}</span></div>
    </div>
    ${g ? `<div class="math">
      <span>Citizen marks</span><span>+${R.cit}</span>
      <span class="minus">Culprit marks (${R.cul} × −${R.cw ?? 1})</span><span class="minus">−${R.cul * (R.cw ?? 1)}</span>
      <span>Net, out of ${R.expected} expected</span><span>${R.net}</span>
      <span>Adjusted average per class (goal ${R.target})</span><span>${R.avg.toFixed(2)}</span>
      <span class="tot">Suggested grade</span><span class="tot">${g.grade}</span>
      ${R.unit ? `<span>${esc(R.unit.name)} points (${g.grade}% of ${R.unit.pts})</span><span>${fmtPts(R.unit.points)}</span>` : ""}
    </div>` : `<p class="none" style="margin:0">No class days recorded for you yet.</p>`}
    <div>
      <div class="bar" aria-hidden="true"><span style="width:${pct}%"></span><i style="left:calc(${goal}% - 1px)"></i></div>
      <p class="small" style="margin:6px 0 0">Your adjusted average is ${R.avg == null ? "0" : R.avg.toFixed(1)} per class. The line marks the goal of ${R.target}. Present ${R.present} of ${R.days} class days.</p>
    </div>
    <div class="unofficial"><b>Unofficial, suggested grade.</b> Your teacher makes the final call and may adjust this grade in the gradebook. If your gradebook grade is different from what you see here, you're welcome to ask why.</div>
    <p class="small" style="margin:0">How it works: each citizen mark counts +1 and each culprit mark −${R.cw ?? 1}. Some classes have a lower goal, so your net is compared with the total you were expected to reach, then scaled to a goal of ${R.target}. That adjusted average sets your grade (${(R.scale || []).map(([x, g]) => `${x} → ${g}`).join(", ")}; in between scales evenly).</p>
  </section>
  ${(R.units || []).length ? `<section class="card"><h2>Your units</h2><ul class="counts">${R.units.map(u => `<li><span>${esc(u.name)}${u.current ? ` <span class="pill">In progress</span>` : ""}</span><b>${u.points == null ? "–" : `${fmtPts(u.points)} / ${u.pts}`}</b></li>`).join("")}</ul></section>` : ""}
  ${R.fb.length ? `<section class="card"><h2>Feedback from your teacher</h2>${R.fb.map(f => `<div class="fb"><span class="small">${esc(f.label || fmtDate(f.d))}</span><p>${esc(f.text)}</p></div>`).join("")}</section>` : ""}
  <section class="card"><h2>How you contributed</h2>${counts(R.citBy, "")}</section>
  <section class="card"><h2>Culprit marks</h2>${counts(R.culBy, "x")}</section>
  ${R.recent.length ? `<section class="card"><h2>Recent classes</h2><div>${R.recent.map(d => `<div class="day"><span class="small">${esc(fmtDate(d.d))}${d.title ? `<br><b class="dt">${esc(d.title)}</b>` : ""}${d.goal && d.goal !== R.target ? `<br>Goal ${d.goal}` : ""}</span><span>${d.a ? `<span class="none">Absent</span>` : (d.c.length || d.x.length) ? d.c.map(l => `<span class="tag">${esc(l)}</span>`).join("") + d.x.map(l => `<span class="tag x">${esc(l)}</span>`).join("") : `<span class="none">No marks</span>`}</span></div>`).join("")}</div></section>` : ""}
  <button class="btn ghost" id="lock" type="button">Hide my grade</button>`;
  $("#lock").onclick = () => { $("#report").innerHTML = ""; $("#form").hidden = false; $("#code").value = ""; try { localStorage.removeItem("my-code"); } catch(e){} };
}

$("#form").addEventListener("submit", async ev => {
  ev.preventDefault();
  const code = $("#code").value; const err = $("#err"); err.hidden = true;
  if (normCode(code).length < 8){ err.textContent = "Codes have 8 letters and numbers, like ABCD-2345."; err.hidden = false; return; }
  $("#go").disabled = true; $("#go").textContent = "Opening…";
  try {
    const R = await open(code);
    try { $("#remember").checked ? localStorage.setItem("my-code", code) : localStorage.removeItem("my-code"); } catch(e){}
    $("#form").hidden = true; render(R);
  } catch(e){
    err.textContent = e.message === "code" ? "That code didn't match. Check for typos (there's no letter O, I or L, or number 0 or 1), or ask your teacher." : e.message === "none" ? "Grades haven't been posted yet. Check back after class." : "Couldn't open your report. Check your connection and try again.";
    err.hidden = false;
  }
  $("#go").disabled = false; $("#go").textContent = "See my grade";
});
try { const c = localStorage.getItem("my-code"); if (c){ $("#code").value = c; $("#remember").checked = true; } } catch(e){}
})();
</script>
</body>
</html>
